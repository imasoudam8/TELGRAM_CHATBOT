# Production Docker Compose override:
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Enforces mandatory non-default credentials, Redis authentication, read-only rootfs,
# strict migration readiness checks, and bounded log rotation.

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in production}

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}
    command:
      - sh
      - -c
      - >
        exec redis-server
        --save 60 1000
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --requirepass "$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  bot:
    image: ${BOT_IMAGE:-telegram-matching-bot:latest}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: production
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN must be set in production}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in production}
      POSTGRES_ECHO: "false"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}
      REQUIRE_MIGRATIONS_CURRENT: "true"
      HEALTH_SERVER_ENABLED: "true"
      HEALTH_HOST: "127.0.0.1"
      HEALTH_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
    healthcheck:
      test: ["CMD", "python", "-m", "src.app.infrastructure.healthcheck", "--check-migrations"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
