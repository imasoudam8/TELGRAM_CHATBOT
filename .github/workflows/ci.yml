name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Compile & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_postgres_password
          POSTGRES_DB: matching_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matching_bot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      BOT_TOKEN: "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ_CI_TEST_TOKEN"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "ci_test_postgres_password"
      POSTGRES_DB: matching_bot_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      TIMEZONE: "Asia/Tehran"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install PostgreSQL 16 Client Tools for Backup/Restore Validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Verify PostgreSQL 16 Client Tool Compatibility
        run: |
          pg_dump --version
          pg_restore --version
          psql --version
          pg_dump --version | grep -qE '\(PostgreSQL\) 16\.'
          pg_restore --version | grep -qE '\(PostgreSQL\) 16\.'
          psql --version | grep -qE '\(PostgreSQL\) 16\.'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Ruff Lint Check
        run: |
          ruff check .

      - name: Ruff Format Check
        run: |
          ruff format --check .

      - name: Python Bytecode Compilation Validation
        run: |
          python -m compileall src tests scripts migrations

      - name: Run Standard Test Suite
        run: |
          pytest -v

      - name: Run Test Suite (Random Order Pass 1 - Seed 12345)
        run: |
          pytest -v --random-order-seed=12345

      - name: Run Test Suite (Random Order Pass 2 - Seed 67890)
        run: |
          pytest -v --random-order-seed=67890

      - name: Run Test Suite (Random Order Pass 3 - Seed 99999)
        run: |
          pytest -v --random-order-seed=99999

  docker-and-deployment-validation:
    name: Docker Build, Compose & Runtime Health Validation
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configurations
        env:
          BOT_TOKEN: "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ_CI_TEST_TOKEN"
          POSTGRES_USER: bot_prod_user
          POSTGRES_PASSWORD: "StrongCiValidationDbPassword_99!"
          POSTGRES_DB: matching_bot
          REDIS_PASSWORD: "StrongCiValidationRedisPass_99!"
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null

      - name: Build Production Docker Image
        run: |
          docker build -t telegram-matching-bot:ci .

      - name: Verify Non-Root Runtime User and Operational Tooling (PG 16 + GPG)
        run: |
          uid="$(docker run --rm --entrypoint id telegram-matching-bot:ci -u)"
          test "$uid" = "10001"
          docker run --rm --entrypoint sh telegram-matching-bot:ci -eu -c '
            pg_dump --version | grep -qE "\(PostgreSQL\) 16\."
            pg_restore --version | grep -qE "\(PostgreSQL\) 16\."
            psql --version | grep -qE "\(PostgreSQL\) 16\."
            gpg --version >/dev/null
            ./scripts/backup_postgres.py --help >/dev/null
            ./scripts/restore_postgres.py --help >/dev/null
          '

      - name: Validate Container Migration, Healthcheck & Production Secret Guard
        run: |
          set -euo pipefail
          net_name="ci_bot_net_${GITHUB_RUN_ID}"
          docker network create "$net_name"
          cleanup() {
            docker rm -f ci_pg ci_redis ci_bot_test >/dev/null 2>&1 || true
            docker network rm "$net_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name ci_pg --network "$net_name" \
            -e POSTGRES_USER=bot_prod_user \
            -e POSTGRES_PASSWORD="StrongCiValidationDbPassword_99!" \
            -e POSTGRES_DB=matching_bot \
            postgres:16-alpine

          docker run -d --name ci_redis --network "$net_name" \
            redis:7-alpine \
            redis-server --requirepass "StrongCiValidationRedisPass_99!" --maxmemory-policy noeviction

          for _ in $(seq 1 30); do
            if docker exec ci_pg pg_isready -U bot_prod_user -d matching_bot >/dev/null 2>&1 \
               && docker exec -e REDISCLI_AUTH="StrongCiValidationRedisPass_99!" ci_redis redis-cli ping >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # 1. Production config guard must reject missing/weak credentials
          if docker run --rm --entrypoint python telegram-matching-bot:ci -c \
            "from src.app.config.settings import Settings; Settings()" >/dev/null 2>&1; then
            echo "ERROR: Expected startup failure when BOT_TOKEN is missing"
            exit 1
          fi

          # 2. Apply migrations using container script
          docker run --rm --network "$net_name" --entrypoint ./scripts/run_migrations.sh \
            -e APP_ENV=staging \
            -e BOT_TOKEN="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ_CI_TEST_TOKEN" \
            -e POSTGRES_HOST=ci_pg \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=bot_prod_user \
            -e POSTGRES_PASSWORD="StrongCiValidationDbPassword_99!" \
            -e POSTGRES_DB=matching_bot \
            -e REDIS_HOST=ci_redis \
            -e REDIS_PORT=6379 \
            -e REDIS_PASSWORD="StrongCiValidationRedisPass_99!" \
            telegram-matching-bot:ci

          # 3. Verify healthcheck + migration readiness inside container
          docker run --rm --network "$net_name" --entrypoint python \
            -e APP_ENV=staging \
            -e REQUIRE_MIGRATIONS_CURRENT=true \
            -e BOT_TOKEN="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ_CI_TEST_TOKEN" \
            -e POSTGRES_HOST=ci_pg \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=bot_prod_user \
            -e POSTGRES_PASSWORD="StrongCiValidationDbPassword_99!" \
            -e POSTGRES_DB=matching_bot \
            -e REDIS_HOST=ci_redis \
            -e REDIS_PORT=6379 \
            -e REDIS_PASSWORD="StrongCiValidationRedisPass_99!" \
            telegram-matching-bot:ci -m src.app.infrastructure.healthcheck --check-migrations
