name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Compile & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_postgres_password
          POSTGRES_DB: matching_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matching_bot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      BOT_TOKEN: "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ_CI_TEST_TOKEN"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "ci_test_postgres_password"
      POSTGRES_DB: matching_bot_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      TIMEZONE: "Asia/Tehran"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Ruff Lint Check
        run: |
          ruff check .

      - name: Ruff Format Check
        run: |
          ruff format --check .

      - name: Python Bytecode Compilation Validation
        run: |
          python -m compileall src tests

      - name: Run Standard Test Suite
        run: |
          pytest -v

      - name: Run Test Suite (Random Order Pass 1 - Seed 12345)
        run: |
          pytest -v --random-order-seed=12345

      - name: Run Test Suite (Random Order Pass 2 - Seed 67890)
        run: |
          pytest -v --random-order-seed=67890

      - name: Run Test Suite (Random Order Pass 3 - Seed 99999)
        run: |
          pytest -v --random-order-seed=99999
